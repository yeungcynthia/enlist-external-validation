[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enlist-external-validation"
version = "0.1.0"
description = "EnLiST episode alignment and LoT/PFS validation metrics"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=2,<4"]

[project.scripts]
enlist-validate = "evaluate:main"

[tool.setuptools]
py-modules = ["alignment", "evaluate"]
